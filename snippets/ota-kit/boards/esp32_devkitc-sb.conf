# MCUboot's stock configuration for the ESP32 has no console and no log.
# The tests read MCUboot's log lines, so switch them on.
SB_CONFIG_OTA_KIT_MCUBOOT_CONSOLE_LOG=y

# MCUboot starts the watchdog, 30 s, and feeds it during a swap. An image that dies before
# the application arms its own watchdog is then reset and reverted.
SB_CONFIG_OTA_KIT_MCUBOOT_WATCHDOG_TIMEOUT_MS=30000
