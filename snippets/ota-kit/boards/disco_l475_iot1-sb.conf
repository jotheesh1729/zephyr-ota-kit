#
# Internal flash erases in 2 K pages, the QSPI flash in 4 K sectors.
# MCUboot needs one sector size for both slots.
SB_CONFIG_OTA_KIT_MCUBOOT_LOGICAL_SECTOR_SIZE=0x1000

# The STM32L4 independent watchdog cannot do MCUboot's default of 300 s (max about 32.7 s)
SB_CONFIG_OTA_KIT_MCUBOOT_WATCHDOG_TIMEOUT_MS=30000
