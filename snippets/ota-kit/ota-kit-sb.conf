# Sysbuild side of the OTA kit: MCUboot, swap using move, ECDSA P256 signatures,
# and the kit itself in the application image.
# The signing key is not set here. Pass it on the command line:
#   -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"/abs/path/key.pem\"
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_OTA_KIT=y
SB_CONFIG_OTA_KIT_DOWNGRADE_PREVENTION=y
