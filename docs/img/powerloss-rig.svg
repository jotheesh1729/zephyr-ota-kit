<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Helvetica, Arial, sans-serif">
  <title>Power loss test rig wiring</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#222222"/></marker>
    <marker id="b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1f6feb"/></marker>
  </defs>
  <text x="30" y="34" text-anchor="start" font-size="16" font-weight="bold" fill="#222222">Power loss test rig</text>
  <rect x="40" y="250" width="180" height="70" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="130.0" y="281.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Laptop</text>
  <text x="130.0" y="297.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">test scripts</text>
  <rect x="40" y="100" width="180" height="70" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="130.0" y="131.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">ESP32 board</text>
  <text x="130.0" y="147.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">relay controller</text>
  <rect x="330" y="100" width="170" height="70" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="415.0" y="131.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Relay module</text>
  <text x="415.0" y="147.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">5 V coil</text>
  <rect x="330" y="250" width="170" height="70" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="415.0" y="281.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Bench supply</text>
  <text x="415.0" y="297.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">9 V, 500 mA</text>
  <rect x="650" y="160" width="210" height="100" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="755.0" y="198.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">STM32 board</text>
  <text x="755.0" y="214.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">under test</text>
  <text x="755.0" y="230.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">VIN, JP4 on 3-4</text>
  <polyline points="130,250 130,170" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="138" y="215" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">USB commands</text>
  <polyline points="220,135 330,135" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="275" y="125" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555">5 V, GND, D26</text>
  <polyline points="415,250 415,170" fill="none" stroke="#1f6feb" stroke-width="2"/>
  <text x="423" y="215" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">+9 V</text>
  <polyline points="500,135 600,135 600,190 650,190" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#b)"/>
  <text x="560" y="125" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555">switched +9 V</text>
  <polyline points="500,300 600,300 600,235 650,235" fill="none" stroke="#222222" stroke-width="1.5"/>
  <text x="560" y="318" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555">ground</text>
  <polyline points="650,250 590,250 590,345 220,345 220,305" fill="none" stroke="#222222" stroke-width="1.5" stroke-dasharray='6 4' marker-end="url(#a)"/>
  <text x="400" y="365" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555">USB: console, flash</text>
  <text x="650" y="290" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">Relay open: board has no power.</text>
</svg>
