<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Helvetica, Arial, sans-serif">
  <title>Flash layout</title>
  <rect width="900" height="470" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#222222"/></marker>
    <marker id="b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1f6feb"/></marker>
  </defs>
  <text x="30" y="34" text-anchor="start" font-size="16" font-weight="bold" fill="#222222">Flash layout, not to scale</text>
  <text x="30" y="70" text-anchor="start" font-size="13" font-weight="bold" fill="#222222">STM32 B-L475E, internal flash, 1 MB</text>
  <rect x="30" y="80" width="130" height="50" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="95.0" y="101.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222222">MCUboot</text>
  <text x="95.0" y="117.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">64 K</text>
  <text x="32" y="146" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">0x00000</text>
  <rect x="160" y="80" width="430" height="50" fill="#f0f0f0" stroke="#1f6feb" stroke-width="2"/>
  <text x="375.0" y="101.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222222">Slot 0</text>
  <text x="375.0" y="117.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">868 K</text>
  <text x="162" y="146" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">0x10000</text>
  <rect x="590" y="80" width="110" height="50" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="645.0" y="101.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222222">unused</text>
  <text x="645.0" y="117.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">60 K</text>
  <text x="592" y="146" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">0xE9000</text>
  <rect x="700" y="80" width="110" height="50" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="755.0" y="101.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222222">storage</text>
  <text x="755.0" y="117.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">32 K</text>
  <text x="702" y="146" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">0xF8000</text>
  <text x="30" y="190" text-anchor="start" font-size="13" font-weight="bold" fill="#222222">STM32 B-L475E, external QSPI flash, 8 MB</text>
  <rect x="30" y="200" width="430" height="50" fill="#f0f0f0" stroke="#1f6feb" stroke-width="2"/>
  <text x="245.0" y="221.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222222">Slot 1</text>
  <text x="245.0" y="237.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">864 K</text>
  <text x="32" y="266" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">0x000000</text>
  <rect x="460" y="200" width="350" height="50" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="635.0" y="221.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222222">not used</text>
  <text x="635.0" y="237.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">7 M</text>
  <text x="462" y="266" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">0x0D8000</text>
  <text x="30" y="310" text-anchor="start" font-size="13" font-weight="bold" fill="#222222">ESP32 WROOM-32, SPI flash, 4 MB</text>
  <rect x="30" y="320" width="100" height="50" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="80.0" y="341.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222222">MCUboot</text>
  <text x="80.0" y="357.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">60 K</text>
  <text x="32" y="386" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">0x1000</text>
  <rect x="130" y="320" width="80" height="50" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="170.0" y="341.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222222">sys</text>
  <text x="170.0" y="357.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">64 K</text>
  <text x="132" y="386" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">0x10000</text>
  <rect x="210" y="320" width="230" height="50" fill="#f0f0f0" stroke="#1f6feb" stroke-width="2"/>
  <text x="325.0" y="341.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222222">Slot 0</text>
  <text x="325.0" y="357.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">1344 K</text>
  <text x="212" y="386" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">0x20000</text>
  <rect x="440" y="320" width="230" height="50" fill="#f0f0f0" stroke="#1f6feb" stroke-width="2"/>
  <text x="555.0" y="341.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222222">Slot 1</text>
  <text x="555.0" y="357.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">1344 K</text>
  <text x="442" y="386" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">0x170000</text>
  <rect x="670" y="320" width="100" height="50" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="720.0" y="341.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222222">other slots</text>
  <text x="720.0" y="357.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">960 K</text>
  <text x="672" y="386" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">0x2C0000</text>
  <rect x="770" y="320" width="80" height="50" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="810.0" y="341.5" text-anchor="middle" font-size="12" font-weight="bold" fill="#222222">storage</text>
  <text x="810.0" y="357.5" text-anchor="middle" font-size="12" font-weight="normal" fill="#222222">192 K</text>
  <text x="772" y="386" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">0x3B0000</text>
  <text x="30" y="430" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">Blue: the two image slots. Slot 0 runs. Slot 1 receives the update.</text>
  <text x="30" y="450" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">The ESP32 scratch partition (124 K at 0x3E0000) is not drawn. Swap using move does not use it.</text>
</svg>
