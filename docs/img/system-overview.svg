<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Helvetica, Arial, sans-serif">
  <title>System overview</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#222222"/></marker>
    <marker id="b" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1f6feb"/></marker>
  </defs>
  <text x="30" y="34" text-anchor="start" font-size="16" font-weight="bold" fill="#222222">System overview</text>
  <rect x="30" y="60" width="260" height="300" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="160" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Host computer</text>
  <rect x="60" y="104" width="200" height="54" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="160.0" y="127.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">build.sh</text>
  <text x="160.0" y="143.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">builds, signs</text>
  <rect x="60" y="184" width="200" height="54" fill="#f0f0f0" stroke="#1f6feb" stroke-width="2"/>
  <text x="160.0" y="207.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">ota_update.py</text>
  <text x="160.0" y="223.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">uploads, checks</text>
  <rect x="60" y="264" width="200" height="54" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="160.0" y="287.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">ota_doctor.py</text>
  <text x="160.0" y="303.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">checks a build</text>
  <rect x="470" y="60" width="400" height="300" fill="#ffffff" stroke="#222222" stroke-width="1.5"/>
  <text x="670" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Device</text>
  <rect x="500" y="104" width="150" height="54" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="575.0" y="127.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">MCUboot</text>
  <text x="575.0" y="143.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">verifies, swaps</text>
  <rect x="500" y="184" width="150" height="134" fill="#f0f0f0" stroke="#1f6feb" stroke-width="2"/>
  <text x="575.0" y="231.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Application</text>
  <text x="575.0" y="247.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">SMP server</text>
  <text x="575.0" y="263.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">health check</text>
  <text x="575.0" y="279.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">watchdog feed</text>
  <rect x="700" y="104" width="140" height="54" fill="#f0f0f0" stroke="#222222" stroke-width="1.5"/>
  <text x="770.0" y="127.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Slot 0</text>
  <text x="770.0" y="143.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">running image</text>
  <rect x="700" y="264" width="140" height="54" fill="#f0f0f0" stroke="#1f6feb" stroke-width="2"/>
  <text x="770.0" y="287.5" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Slot 1</text>
  <text x="770.0" y="303.5" text-anchor="middle" font-size="13" font-weight="normal" fill="#222222">new image</text>
  <polyline points="160,158 160,184" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="260,211 500,211" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#b)"/>
  <text x="380" y="201" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555">signed image</text>
  <text x="380" y="231" text-anchor="middle" font-size="12" font-weight="normal" fill="#555555">UART, BLE, UDP</text>
  <polyline points="650,291 700,291" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#b)"/>
  <polyline points="650,131 700,131" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/>
  <polyline points="770,264 770,158" fill="none" stroke="#1f6feb" stroke-width="2" marker-end="url(#b)"/>
  <text x="780" y="215" text-anchor="start" font-size="12" font-weight="normal" fill="#555555">swap</text>
  <polyline points="575,158 575,184" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
