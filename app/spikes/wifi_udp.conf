# Transport spike, not part of the normal build.
# Usage: scripts/build.sh 9.1.0 -DEXTRA_CONF_FILE=spikes/wifi_udp.conf
# Result: see docs/TRANSPORTS.md
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y
CONFIG_WIFI=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
CONFIG_MCUMGR_TRANSPORT_UDP_IPV4=y
CONFIG_LOG=y
CONFIG_MCUMGR_TRANSPORT_LOG_LEVEL_DBG=y
